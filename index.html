<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa da Azóia — Local Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#F5F1EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa da Azóia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>@font-face{font-family:"The Future";src:url(fonts/thefuture-300.otf) format("opentype");font-weight:300;font-display:swap}
@font-face{font-family:"The Future";src:url(fonts/thefuture-400.otf) format("opentype");font-weight:400;font-display:swap}
:root{
  /* Casa da Azóia brand */
  --azul:#3B79D3; --verde:#005A4D; --terra:#BC5F4D; --areia:#CEA988; --cal:#F5F1EB; --tinta:#141414;
  --ink:#141414; --ink2:#5e5a54; --ink3:#9a948a;
  --glass:rgba(255,255,255,.58); --line:rgba(20,20,20,.08);
  --ocean:#3B79D3; --ocean2:#6f9fe2; --sun:#CEA988; --sunset:#BC5F4D; --leaf:#005A4D; --violet:#2d7a6c;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 12px 32px rgba(60,45,30,.08), 0 1px 0 rgba(255,255,255,.7) inset;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"The Future",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-weight:400;
  color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 520px at 0% -10%, rgba(59,121,211,.16) 0%, transparent 60%),
    radial-gradient(800px 520px at 110% 15%, rgba(206,169,136,.35) 0%, transparent 60%),
    radial-gradient(800px 600px at 50% 120%, rgba(0,90,77,.12) 0%, transparent 60%),
    var(--cal);
  background-attachment:fixed;
  padding-bottom:calc(100px + env(safe-area-inset-bottom));
}
b,strong,h1,h2,h3{font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 0}
.a2hs{background:rgba(255,255,255,.94)!important;position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,24px);width:min(500px,calc(100% - 28px));border-radius:24px;padding:16px 16px 14px;z-index:40;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.a2hs.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.a2hs .row{display:flex;gap:13px;align-items:flex-start}
.a2hs .ic{flex:none;width:52px;height:52px;border-radius:13px;background:url(icons/icon-192.png) center/cover;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.a2hs b{display:block;font-size:16px;font-weight:500;margin:2px 0 3px}
.a2hs p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.a2hs .sh{display:inline-block;vertical-align:-3px;width:16px;height:16px;color:var(--azul)}
.a2hs .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.a2hs button{border-radius:999px;padding:9px 16px;font-size:14px}
.a2hs .ok{background:var(--verde);color:var(--cal)}
.a2hs .no{background:rgba(0,0,0,.05);color:var(--ink2)}
.chef{border-radius:var(--r-xl);margin-top:14px;overflow:hidden}
.chef .strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 6px 0}
.chef .strip::-webkit-scrollbar{display:none}
.chef .strip img{flex:0 0 72%;height:190px;object-fit:cover;border-radius:20px;scroll-snap-align:start}
.chef .body{padding:16px 18px 18px}
.chef .eb{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--terra)}
.chef h3{font-size:22px;font-weight:400;margin:4px 0 6px;letter-spacing:-.01em}
.chef .lead{margin:0 0 12px;color:var(--ink2);font-size:14.5px;line-height:1.5}
.chef .offers{display:grid;gap:8px}
.chef .offer{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:16px;padding:11px 13px}
.chef .offer b{font-weight:500;font-size:15px}.chef .offer span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.chef .offer .pr{white-space:nowrap;font-size:15px;color:var(--verde);font-weight:500}
.chef .note{font-size:12.5px;color:var(--ink2);margin:10px 2px 0;line-height:1.45}
.chef .form{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.chef.open .form{display:block}.chef.open .openf{display:none}
.chef label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:12px 2px 6px}
.chef input[type=date],.chef textarea{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.chef textarea{min-height:64px;resize:vertical}
.chef .step{display:flex;align-items:center;gap:12px}.chef .step button{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:18px}
.chef .step output{min-width:28px;text-align:center;font-size:17px}
.chef .warn{font-size:12.5px;color:var(--terra);margin:8px 2px 0;min-height:1em}
.chef .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.mask{display:inline-block;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.logo-word{--m:url(marca/logotipo.svg);width:150px;height:24px;color:var(--tinta)}
.sym{--m:url(marca/simbolo-a.svg)}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand small{display:block;font-size:11px;color:var(--ink3);letter-spacing:.14em;text-transform:uppercase;margin-top:6px;font-weight:300}
.lang{display:flex;padding:3px;border-radius:999px}
.lang button{padding:6px 12px;border-radius:999px;font-size:12px;color:var(--ink2);letter-spacing:.04em}
.lang button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.07)}

.view{display:none;animation:fade .4s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:36px;line-height:1.05;letter-spacing:-.02em;margin:8px 2px 4px;font-weight:300}
h2{font-size:21px;letter-spacing:-.01em;margin:30px 2px 12px;font-weight:400}
.muted{color:var(--ink2)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin:0 2px;font-weight:400}

.hero{border-radius:var(--r-xl);padding:22px;margin-top:16px;position:relative;overflow:hidden;color:#fff;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 18px 40px rgba(20,20,20,.18)}
.hero .sky{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;transition:background 1s}
.hero > *:not(.sky):not(.sun-dot){position:relative;z-index:1}
.hero .now{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.9;display:flex;gap:8px;align-items:center;position:absolute!important;top:20px;left:22px}
.hero .tip{text-shadow:0 1px 12px rgba(0,0,0,.25);font-size:28px;font-weight:300;letter-spacing:-.015em;line-height:1.1;margin:0 0 8px;max-width:92%}
.hero .why{font-size:14.5px;opacity:.94;line-height:1.45;max-width:95%;font-weight:300}
.hero .cta{margin-top:16px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;border-radius:999px;font-size:14px}
.sun-dot{position:absolute;right:20px;top:16px;width:34px;height:56px;z-index:1;color:rgba(255,255,255,.85)}

.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pill{border-radius:var(--r-lg);padding:13px}
.pill .k{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em}
.pill .v{font-size:21px;margin-top:6px;letter-spacing:-.01em;font-weight:300}
.pill .s{font-size:12px;color:var(--ink2);margin-top:2px;font-weight:300}

.today-list{display:flex;flex-direction:column;gap:10px}
.trow{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg)}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff}
.trow b{display:block;font-size:15.5px}
.trow span{font-size:13px;color:var(--ink2);font-weight:300}
.trow .go{margin-left:auto;color:var(--ink3)}
.badge{display:inline-block;white-space:nowrap;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(0,90,77,.12);color:var(--verde);margin-left:7px;vertical-align:middle}
.badge.new{background:rgba(59,121,211,.13);color:var(--azul)}
.badge.top{background:var(--terra);color:#fff}
.badge.mich{background:#b3122e;color:#fff;letter-spacing:.06em}
.badge.jfav{background:var(--verde);color:#fff;white-space:nowrap}
.badge.secret{background:rgba(188,95,77,.13);color:var(--terra)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 18px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 15px;border-radius:999px;font-size:14px;display:flex;align-items:center;gap:7px;transition:all .2s}
.chip.on{background:var(--verde);color:#fff;border-color:var(--verde)}

.grid{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.card{border-radius:var(--r-xl);overflow:hidden;transition:transform .2s}
.card:active{transform:scale(.99)}
.card .head{display:flex;gap:12px;padding:16px;align-items:flex-start;text-align:left;width:100%}
.card .head h3{margin:0;font-size:18px;letter-spacing:-.01em}
.card .head p{margin:4px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.4;font-weight:300}
.card .fav{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);background:rgba(255,255,255,.65)}
.card .fav.on{color:var(--terra)}
.card .more{max-height:0;overflow:hidden;transition:max-height .45s ease}
.card.open .more{max-height:900px}
.card .inner{padding:0 16px 16px}
.card .inner p{font-size:15px;line-height:1.55;margin:0 0 12px;color:#2a2724;font-weight:300}
.tips{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.tips li{font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:var(--r-sm);background:rgba(255,255,255,.7);border:1px solid var(--line);display:flex;gap:9px;font-weight:300}
.tips li i{font-style:normal;color:var(--terra)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:999px;font-size:13.5px;background:#fff;border:1px solid var(--line)}
.btn.primary{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.btn.wa{background:var(--verde);color:#fff;border-color:var(--verde)}
.numtxt{font-size:12px;color:var(--ink3);margin-top:8px;letter-spacing:.03em}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.meta span{font-size:11.5px;color:var(--ink2);background:rgba(206,169,136,.22);padding:5px 10px;border-radius:999px}

.picker{border-radius:var(--r-xl);padding:18px;margin-top:12px}
.q{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.q:last-of-type{border-bottom:0}
.seg{display:flex;background:rgba(20,20,20,.06);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.result{margin-top:14px;border-radius:var(--r-lg);padding:18px;background:var(--verde);color:#fff;position:relative;overflow:hidden}
.result::after{content:"";position:absolute;right:-14px;bottom:-24px;width:110px;height:180px;background:rgba(255,255,255,.1);-webkit-mask:url(marca/simbolo-a.svg) center/contain no-repeat;mask:url(marca/simbolo-a.svg) center/contain no-repeat}
.result small{opacity:.8;font-size:11px;text-transform:uppercase;letter-spacing:.14em}
.result b{display:block;font-size:26px;margin:6px 0;font-weight:300}
.result p{margin:0;font-size:14px;line-height:1.45;opacity:.95;font-weight:300;max-width:80%}
.result button{margin-top:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);padding:9px 15px;border-radius:999px;font-size:13px;color:#fff;position:relative;z-index:1}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.day{border-radius:16px;padding:10px 0;text-align:center;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.day b{display:block;font-size:19px;color:var(--ink);margin-top:3px;font-weight:300;letter-spacing:0}
.day.on{background:var(--tinta);color:#fff}
.day.on b{color:#fff}
.day .dots{display:flex;gap:3px;justify-content:center;margin-top:5px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.dayinfo{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.empty{padding:18px;border-radius:var(--r-lg);text-align:center;color:var(--ink2);font-size:14px;font-weight:300}

.host{border-radius:var(--r-xl);padding:18px;margin-top:24px;display:flex;gap:14px;align-items:center}
.host .av{width:52px;height:52px;border-radius:50%;background:var(--terra);display:grid;place-items:center;color:#fff;flex:none}
.host .av .sym{width:18px;height:30px}
.host b{font-size:16.5px}
.host p{margin:3px 0 0;font-size:13px;color:var(--ink2);font-weight:300}

.live{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lv{border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:6px}
.lv b{font-size:15.5px}
.lv span{font-size:12.5px;color:var(--ink2);line-height:1.35;font-weight:300}
.lv .ico{width:34px;height:34px;border-radius:11px}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 28px));border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:19px;font-size:11px;color:var(--ink3);transition:all .2s;letter-spacing:.02em}
.tab.on{color:var(--verde);background:rgba(0,90,77,.1)}
.tab svg{width:22px;height:22px}
.count{position:absolute;margin:-4px 0 0 18px;background:var(--terra);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 16px;border-radius:999px;background:rgba(20,20,20,.9);color:#fff;font-size:13px;transition:all .3s;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.thumb{width:52px;height:52px;border-radius:14px;flex:none;background-size:cover;background-position:center;box-shadow:0 4px 12px rgba(20,20,20,.12)}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 14px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery figure{margin:0;flex:0 0 86%;scroll-snap-align:center;position:relative}
.gallery img{width:100%;height:220px;object-fit:cover;border-radius:18px;display:block}
.gallery figcaption{position:absolute;left:10px;bottom:8px;font-size:10px;color:#fff;background:rgba(20,20,20,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:3px 8px;border-radius:999px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result{background-size:cover;background-position:center}
.sea{border-radius:var(--r-xl);padding:16px}
.seadays{margin-bottom:12px;width:fit-content}
.verdict{border-radius:var(--r-lg);padding:14px;margin-bottom:12px;background:rgba(0,90,77,.08)}
.verdict.warn{background:rgba(206,169,136,.25)}
.verdict.bad{background:rgba(188,95,77,.12)}
.verdict b{display:block;font-size:15.5px;line-height:1.35;margin-bottom:4px}
.verdict span{font-size:13.5px;color:var(--ink2);line-height:1.4;font-weight:300}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.slot{background:rgba(255,255,255,.65);border-radius:14px;padding:9px 2px;text-align:center;min-width:0;overflow:hidden}
.slot small{font-size:11px;color:var(--ink3)}
.slot .w{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:5px;color:var(--azul)}
.slot .w svg{width:13px;height:13px;flex:none}
.slot .w b{font-size:15px;color:var(--ink)}
.slot .w em{display:none}
.slot .u{font-size:9px;color:var(--ink3);margin-top:1px}
.slot .wv{font-size:12px;color:var(--ink2);margin-top:3px}
.tides{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tides span{font-size:12px;color:var(--ink2);background:rgba(59,121,211,.08);padding:6px 10px;border-radius:999px}
.tides b{color:var(--ink);font-weight:400}
.best{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.best button{color:var(--verde);font-size:15px}
.upd{font-size:11px;color:var(--ink3);margin:10px 0 0;font-weight:300}
.status{font-size:12.5px;padding:7px 11px;border-radius:999px;display:inline-block;margin:0 0 10px;background:rgba(0,90,77,.1);color:var(--verde)}
.status.soon{background:rgba(206,169,136,.25);color:#7a5a3c}
.status.closed{background:rgba(188,95,77,.12);color:var(--terra)}
.ptable{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:12px}
.ptable table{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:400;text-align:right;padding:4px 0}
.ptable td{padding:6px 0;border-top:1px solid var(--line);text-align:right}
.ptable td:first-child{text-align:left}
.pnote{font-size:11.5px;color:var(--ink2);padding-top:7px;line-height:1.4;font-weight:300}
.seatop{margin-bottom:10px}
.seamode{width:fit-content}
.dot{display:block;font-style:normal;font-size:10px;margin:5px auto 0;padding:2px 6px;border-radius:999px;width:fit-content}
.dot.ok{background:rgba(0,90,77,.12);color:var(--verde)}.dot.warn{background:rgba(206,169,136,.3);color:#7a5a3c}.dot.bad{background:rgba(188,95,77,.12);color:var(--terra)}
.foot{text-align:center;font-size:11px;color:var(--ink3);margin:30px 0 8px;letter-spacing:.06em;font-weight:300}
.foot .sym{width:12px;height:20px;color:var(--areia);display:block;margin:0 auto 10px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand"><span class="mask logo-word" role="img" aria-label="Casa da Azóia"></span><small data-t="tagline"></small></div>
    <div class="lang glass" id="lang">
      <button data-l="en">EN</button><button data-l="pt">PT</button>
    </div>
  </div>

  <!-- TODAY -->
  <section class="view on" id="v-today">
    <p class="eyebrow" id="dateLine"></p>
    <h1 id="greet"></h1>

    <div class="hero" id="hero">
      <div class="sky" id="sky"></div>
      <span class="mask sym sun-dot" id="sunDot"></span>
      <div class="now" id="heroNow"></div>
      <div class="tip" id="heroTip"></div>
      <div class="why" id="heroWhy"></div>
      <button class="cta" id="heroCta"></button>

/* ---------- sun maths (NOAA approximation) ---------- */
function sunTimes(date){
  const rad=Math.PI/180, d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const n=Math.floor((d-Date.UTC(2000,0,1,12))/864e5)+1;
  const Jstar=n - LON/360;
  const M=(357.5291+0.98560028*Jstar)%360;
  const C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const lam=(M+C+180+102.9372)%360;
  const Jt=2451545+Jstar+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*lam*rad);
  const dec=Math.asin(Math.sin(lam*rad)*Math.sin(23.44*rad));
  const cosw=(Math.sin(-0.833*rad)-Math.sin(LAT*rad)*Math.sin(dec))/(Math.cos(LAT*rad)*Math.cos(dec));
  const w=Math.acos(cosw)/rad;
  const toDate=J=>new Date((J-2440587.5)*864e5);
  return {rise:toDate(Jt-w/360), set:toDate(Jt+w/360)};
}

/* ---------- render: today ---------- */
function eventsFor(date){
  const day=date.getDay(), wk=Math.ceil(date.getDate()/7), ev=[];
  CONFIG.markets.forEach(m=>{
    const hit=m.days.includes(day)||(m.nth||[]).some(([d,n])=>d===day&&n===wk);
    if(hit) ev.push({type:"market",feature:!!m.feature,place:m.place,short:m.short,title:m.place,sub:[m.sub?m.sub[L]:"",m.hours].filter(Boolean).join(" · "),color:m.feature?"var(--terra)":"var(--leaf)",icon:"basket",maps:m.maps||"Almoçageme Colares"});
  });
  if(CONFIG.padeira.days.includes(day)) ev.push({type:"bread",title:t("bread"),sub:[CONFIG.padeira.time?`${t("at")} ${CONFIG.padeira.time}`:"",CONFIG.padeira.where?CONFIG.padeira.where[L]:""].filter(Boolean).join(" · "),maps:"Café Pôr do Sol Azóia",color:"var(--sun)",icon:"bread"});
  return ev.sort((a,b)=>b.feature-a.feature);
}
function renderToday(){
  const now=new Date(), hr=+now.toLocaleTimeString("en-GB",{hour:"2-digit",hour12:false,timeZone:"Europe/Lisbon"});
  const {rise,set}=sunTimes(now);
  const toSet=set-now;
  document.getElementById("dateLine").textContent=now.toLocaleDateString(L==="pt"?"pt-PT":"en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/Lisbon"});
  const g=hr<12?t("morning"):hr<19?t("afternoon"):hr<23?t("evening"):t("night");
  document.getElementById("greet").textContent=g+(CONFIG.guestName?", "+CONFIG.guestName:"")+".";
  document.getElementById("sunsetV").textContent=fmt(set);
  document.getElementById("sunsetS").textContent=toSet>0?`${t("inMin")} ${dur(toSet)}`:t("passed");
  document.getElementById("dayV").textContent=dur(set-rise);

  const evs=eventsFor(now), market=evs.find(e=>e.feature);
  let tip,why,cta,act,sky,sunTop;
  const mins=hr*60+(+now.toLocaleTimeString("en-GB",{minute:"2-digit",timeZone:"Europe/Lisbon"}));
  if(mins<9*60+15 && CONFIG.padeira.days.includes(now.getDay())){tip=t("hBread");why=t("hBreadWhy");cta=t("ctaBreadVan");act=()=>{try{window.open(mapsUrl("Café Pôr do Sol Azóia"),"_blank")}catch(e){}};sky=SKY.morning;sunTop=0}
  else if(hr<11 && market){tip=t("hMarket")+(market.short||"Almoçageme")+".";why=market.short==="Azóia"?t("hMarketAzoia"):t("hMarketWhy");cta=t("ctaMarket");act=()=>go("week");sky=SKY.morning;sunTop=0}
  else if(hr<11){tip=t("hMorning");why=t("hMorningWhy");cta=t("ctaBread");act=()=>openCard("ocidente");sky=SKY.morning;sunTop=0}
  else if(toSet>90*6e4){tip=t("hMidday");why=t("hMiddayWhy");cta=t("ctaBeach");act=()=>document.getElementById("picker").scrollIntoView({behavior:"smooth",block:"center"});sky=SKY.day;sunTop=0}
  else if(toSet>0){tip=t("hGolden");why=t("hGoldenWhy").replace("{x}",dur(toSet));cta=t("ctaSunset");act=()=>openCard("roca");sky=SKY.golden;sunTop=0}
  else if(hr<23){tip=t("hDinner");why=t("hDinnerWhy");cta=t("ctaDinner");act=()=>openCard("adragarest");sky=SKY.dinner;sunTop=0}
  else{tip=t("hNight");why=t("hNightWhy");cta=t("ctaNight");act=()=>go("week");sky=SKY.night;sunTop=0}
  document.getElementById("sky").style.backgroundImage=sky;
    document.getElementById("heroNow").innerHTML=`${svg("pin",14)} Azóia · ${fmt(now)}`;

/* ---------- sea & wind (data/conditions.json, refreshed daily) ---------- */
let COND=null, seaDay=0;
const DIRS={N:0,NNE:22,NE:45,ENE:67,E:90,ESE:112,SE:135,SSE:157,S:180,SSW:202,SW:225,WSW:247,W:270,WNW:292,NW:315,NNW:337};
const BEACH_EXPO={ // rough exposure to wind from these directions (0 sheltered .. 1 exposed)
  guincho:{N:1,NNE:1,NE:.8,NNW:1,NW:.9,WNW:.8,W:.8,WSW:.6,SW:.5,SSW:.4,S:.4,default:.5},
  grande:{W:1,WNW:1,NW:.9,WSW:.9,SW:.8,NNW:.7,N:.6,SSW:.6,S:.5,default:.4},
  adraga:{W:.7,WNW:.6,WSW:.6,SW:.5,NW:.5,N:.3,NNW:.4,S:.3,SSW:.4,default:.3},
  pequena:{W:.5,WNW:.5,NW:.4,WSW:.5,SW:.5,N:.3,S:.3,default:.3},
  ursa:{W:1,WSW:1,SW:.9,WNW:.9,NW:.8,S:.7,SSW:.8,N:.6,default:.6}
};
const BEACH_NAME={guincho:"Guincho",grande:"Praia Grande",adraga:"Adraga",pequena:"Praia Pequena",ursa:"Ursa"};
async function loadCond(){try{const r=await fetch("data/conditions.json",{cache:"no-store"});COND=await r.json()}catch(e){COND=null}renderSea();renderPicker();}
function dayCond(i){if(!COND)return null;const d=COND.days[i];if(!d)return null;
  const mid=d.slots.filter(x=>x.t>="09:00"&&x.t<="18:00");const pk=mid.length?mid:d.slots;
  const wind=Math.round(pk.reduce((a,x)=>a+x.wind,0)/pk.length), wave=Math.max(...pk.map(x=>x.wave));
  const dir=(pk.find(x=>x.t==="12:00")||pk[0]).dir; return {d,wind,wave,dir};}
function todayIndex(){if(!COND)return 0;const t=new Date().toLocaleDateString("en-CA",{timeZone:"Europe/Lisbon"});const i=COND.days.findIndex(d=>d.date===t);return i<0?0:i;}
function rankBeaches(c){
  return Object.keys(BEACH_EXPO).map(k=>{const e=BEACH_EXPO[k][c.dir]??BEACH_EXPO[k].default;
    let score=10-e*c.wind/6-(k==="ursa"&&c.wave>2.5?4:0)-(k==="guincho"&&c.wind>25?1:0);return {k,score,e};}).sort((a,b)=>b.score-a.score);}
function seaVerdict(c){
  const pt=L==="pt";
  let swim,level;
  if(c.wave<1.5){level="ok";swim=pt?"Mar calmo — bom para banhos nas praias vigiadas.":"Calm sea — good for swimming at lifeguarded beaches."}
  else if(c.wave<2.5){level="warn";swim=pt?"Ondulação moderada — banhos só com nadador-salvador e com cuidado.":"Moderate swell — swim only where there are lifeguards, and carefully."}
  else {level="bad";swim=pt?`Mar grande (${c.wave} m) — não é dia de banhos. É dia de ver o mar a rebentar.`:`Big sea (${c.wave} m) — not a swimming day. It's a day to watch the waves crash.`}
  const r=rankBeaches(c);const best=r[0].k, worst=r[r.length-1].k;
  let windTxt;
  if(c.wind<15) windTxt=pt?"Pouco vento — qualquer praia serve; o Guincho fica no seu melhor.":"Little wind — any beach works; Guincho is at its best.";
  else windTxt=pt?`Vento de ${c.dir} a ${c.wind} km/h: a ${BEACH_NAME[best]} deve estar mais abrigada; evita a ${BEACH_NAME[worst]}.`:`${c.dir} wind at ${c.wind} km/h: ${BEACH_NAME[best]} should be the most sheltered; avoid ${BEACH_NAME[worst]}.`;
  return {swim,level,windTxt,best,worst};
}
function arrow(dir){const deg=(DIRS[dir]??0)+180;return `<svg width="16" height="16" viewBox="0 0 24 24" style="transform:rotate(${deg}deg)"><path d="M12 3l5 9h-4v9h-2v-9H7z" fill="currentColor"/></svg>`;}
let seaMode="beach";
const SURF_SPOTS={grande:{face:285,name:"Praia Grande"},guincho:{face:250,name:"Guincho"},pequena:{face:280,name:"Praia Pequena"}};
function relAngle(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d;}
function surfScore(k,x){const sp=SURF_SPOTS[k],D=DIRS[x.dir]??0,off=relAngle(D,(sp.face+180)%360);
  let size=x.wave<0.6?0:x.wave<1?2:x.wave<2.5?4:x.wave<3.5?3:1;
  let wind=x.wind<10?2:off<45?(x.wind<35?2:0):off<100?(x.wind<20?0:-1):(x.wind<12?-.5:-2);
  let adj=(k==="pequena"&&x.wave>3?1:0)+(k==="guincho"&&x.wave>3.5?-1:0);
  const kind=off<45?"off":off<100?"cross":"on";
  return {score:size+wind+adj,kind};}
function surfLabel(sc){const pt=L==="pt";return sc>=5?{c:"ok",t:pt?"Bom":"Good"}:sc>=3?{c:"warn",t:pt?"Razoável":"Fair"}:{c:"bad",t:pt?"Fraco":"Poor"};}
function surfVerdict(d){
  const pt=L==="pt";let best=null;
  d.slots.filter(x=>x.t>="09:00"&&x.t<="18:00").forEach(x=>Object.keys(SURF_SPOTS).forEach(k=>{const r=surfScore(k,x);if(!best||r.score>best.score)best={...r,k,x};}));
  const wave=Math.max(...d.slots.map(x=>x.wave));
  let size;
  if(wave<0.6) size=pt?"Mar flat — sem ondas para surfar.":"Flat — no surfable waves.";
  else if(wave<1) size=pt?"Ondas pequenas — ideal para aprender.":"Small waves — ideal for beginners.";
  else if(wave<2.5) size=pt?"Bom tamanho para quem já surfa.":"Good size for intermediate surfers.";
  else if(wave<3.5) size=pt?"Ondas grandes — só para surfistas experientes.":"Big waves — experienced surfers only.";
  else size=pt?`Mar muito grande (${wave} m) — só para experts. Melhor ver do miradouro.`:`Very big sea (${wave} m) — experts only. Best watched from the cliffs.`;
  const kindTxt={off:pt?"vento offshore (de terra) — ondas limpas":"offshore wind — clean waves",cross:pt?"vento cruzado":"cross-shore wind",on:pt?"vento do mar — ondas mexidas":"onshore wind — choppy"}[best.kind];
  const lab=surfLabel(best.score);
  return {level:lab.c,head:size,line:(pt?`Melhor aposta: ${SURF_SPOTS[best.k].name} às ${best.x.t} · ${kindTxt}.`:`Best bet: ${SURF_SPOTS[best.k].name} at ${best.x.t} · ${kindTxt}.`),best:best.k};
}
function renderSea(){
  const el=document.getElementById("sea");if(!el)return;
  if(!COND){el.innerHTML=`<div class="empty">${L==="pt"?"Previsão indisponível de momento.":"Forecast unavailable right now."}</div>`;return;}
  const ti=todayIndex(); if(seaDay<ti) seaDay=ti;
  const names=COND.days.map((d,i)=>i===ti?(L==="pt"?"Hoje":"Today"):i===ti+1?(L==="pt"?"Amanhã":"Tomorrow"):new Date(d.date+"T12:00").toLocaleDateString(L==="pt"?"pt-PT":"en-GB",{weekday:"short",day:"numeric"}));
  const c=dayCond(seaDay); const v=seaVerdict(c); const sv=surfVerdict(c.d); const pt=L==="pt";
  const tides=c.d.tides.length?`<div class="tides">${c.d.tides.map(x=>`<span>${x.type==="high"?(L==="pt"?"Preia-mar":"High tide"):(L==="pt"?"Baixa-mar":"Low tide")} <b>${x.t}</b></span>`).join("")}</div>`:"";
  const upd=new Date(COND.updated).toLocaleString(L==="pt"?"pt-PT":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Lisbon"});
  const verdictHTML=seaMode==="beach"?`<div class="verdict ${v.level}"><b>${v.swim}</b><span>${v.windTxt}</span></div>`:`<div class="verdict ${sv.level}"><b>${sv.head}</b><span>${sv.line}</span></div>`;
  const slotsHTML=`<div class="slots">${c.d.slots.map(x=>{let tag="";if(seaMode==="surf"){const b=Object.keys(SURF_SPOTS).map(k=>surfScore(k,x)).sort((a,b)=>b.score-a.score)[0];const lb=surfLabel(b.score);tag=`<i class="dot ${lb.c}">${lb.t}</i>`;}return `<div class="slot"><small>${x.t}</small><div class="w">${arrow(x.dir)}<b>${x.wind}</b><em>km/h</em></div><div class="u">km/h</div><div class="wv">${x.wave} m${seaMode==="surf"?" · "+x.period+"s":""}</div>${tag}</div>`}).join("")}</div>`;
  const bestK=seaMode==="beach"?v.best:sv.best;
  el.innerHTML=`<div class="seatop"><div class="seg seamode"><button class="${seaMode==="beach"?"on":""}" data-m="beach">${pt?"Praia":"Beach"}</button><button class="${seaMode==="surf"?"on":""}" data-m="surf">Surf</button></div></div><div class="seg seadays">${COND.days.map((d,i)=>i<ti?"":`<button class="${i===seaDay?"on":""}" data-i="${i}">${names[i]}</button>`).join("")}</div>
   ${verdictHTML}
   ${slotsHTML}
   ${tides}
   <div class="best"><span>${seaMode==="beach"?(pt?"Melhor praia":"Best beach"):(pt?"Melhor spot de surf":"Best surf spot")}</span><button data-open="${bestK}">${BEACH_NAME[bestK]} ›</button></div>
   <p class="upd">${L==="pt"?"Previsão atualizada":"Forecast updated"} ${upd} · ${COND.source}</p>`;
  el.querySelectorAll(".seadays button").forEach(b=>b.onclick=()=>{seaDay=+b.dataset.i;renderSea()});
  el.querySelectorAll(".seamode button").forEach(b=>b.onclick=()=>{seaMode=b.dataset.m;renderSea()});
  const o=el.querySelector("[data-open]");if(o)o.onclick=()=>openCard(o.dataset.open);

const chefState={svc:"dinner",people:6,days:2,date:"",notes:""};
function chefMinDate(){const d=new Date();d.setDate(d.getDate()+3);return d}
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function renderChef(id){
  const el=document.getElementById(id);if(!el)return;const pt=L==="pt";
  const min=chefMinDate();const minTxt=min.toLocaleDateString(pt?"pt-PT":"en-GB",{weekday:"long",day:"numeric",month:"long"});
  if(!chefState.date)chefState.date=isoD(min);
  const S=chefState, bf=S.svc==="breakfast";
  el.innerHTML=`<div class="strip">${CHEF.imgs.map(k=>`<img loading="lazy" src="img/places/${k}.jpg" alt="">`).join("")}</div>
  <div class="body">
    <div class="eb">Tantôt · ${pt?"chef privada":"private chef"}</div>
    <h3>${pt?"Pequeno-almoço, almoço ou jantar, sem sair de casa":"Breakfast, lunch or dinner without leaving the house"}</h3>
    <p class="lead">${pt?"A chef Constança David faz as compras, cozinha aqui, põe a mesa, serve e arruma. Feito de raiz, sempre com o que está na época.":"Chef Constança David does the shopping, cooks here, sets the table, serves and cleans up. Made from scratch, always in season."}</p>
    <div class="offers">
      <div class="offer"><div><b>${pt?"Pequeno-almoço":"Breakfast"}</b><span>${pt?"Prato salgado, prato doce, fruta da época, café, chá, leite e sumo. Mínimo 6 pessoas e 2 manhãs.":"A savoury dish, a sweet dish, seasonal fruit, coffee, tea, milk and juice. Minimum 6 people and 2 mornings."}</span></div><div class="pr">${pt?"13–15 € pp":"€13–15 pp"}</div></div>
      <div class="offer"><div><b>${pt?"Almoço ou jantar":"Lunch or dinner"}</b><span>${pt?"Menu pensado convosco — de vários pratos ou mesa partilhada. Bebidas à parte.":"A menu planned with you — several courses or a sharing table. Drinks not included."}</span></div><div class="pr">${pt?"60–90 € pp":"€60–90 pp"}</div></div>
    </div>
    <p class="note">${pt?`Reserva com pelo menos 3 dias de antecedência — a próxima data disponível é <b>${minTxt}</b>.`:`Book at least 3 days ahead — the earliest date is <b>${minTxt}</b>.`}</p>
    <div class="acts openf"><button class="btn wa" data-a="open">${pt?"Reservar":"Book"}</button><a class="btn" href="tantot-casa-da-azoia.pdf" target="_blank" rel="noopener">${pt?"Ver apresentação":"See the menu (PDF)"}</a></div>
    <div class="form">
      <label>${pt?"O quê":"What"}</label>
      <div class="seg" style="width:fit-content">${[["breakfast",pt?"Pequeno-almoço":"Breakfast"],["lunch",pt?"Almoço":"Lunch"],["dinner",pt?"Jantar":"Dinner"]].map(([k,v])=>`<button data-svc="${k}" class="${S.svc===k?"on":""}">${v}</button>`).join("")}</div>
      <label>${bf?(pt?"Primeira manhã":"First morning"):(pt?"Data":"Date")}</label>
      <input type="date" data-f="date" min="${isoD(min)}" value="${S.date}">
      <label>${pt?"Pessoas":"People"}</label>
      <div class="step"><button data-p="-1">−</button><output>${S.people}</output><button data-p="1">+</button></div>
      ${bf?`<label>${pt?"Quantas manhãs":"How many mornings"}</label><div class="step"><button data-d="-1">−</button><output>${S.days}</output><button data-d="1">+</button></div>`:""}
      <label>${pt?"Alergias, ocasião, pedidos":"Allergies, occasion, requests"}</label>
      <textarea data-f="notes" placeholder="${pt?"Ex.: aniversário, um vegetariano, 2 crianças":"E.g. birthday, one vegetarian, 2 children"}">${S.notes}</textarea>
      <div class="warn" data-w></div>
      <div class="acts"><a class="btn wa" data-a="send" target="_blank" rel="noopener">${pt?"Enviar pedido por WhatsApp":"Send request on WhatsApp"}</a><button class="btn" data-a="close">${pt?"Cancelar":"Cancel"}</button></div>
    </div>
  </div>`;
  const upd=()=>{
    const w=el.querySelector("[data-w]"),a=el.querySelector('[data-a="send"]');const issues=[];
    if(S.date<isoD(min))issues.push(pt?"Escolhe uma data a partir de "+minTxt+".":"Pick a date from "+minTxt+".");
    if(bf&&S.people<6)issues.push(pt?"O pequeno-almoço é para 6 pessoas ou mais.":"Breakfast is for 6 people or more.");
    if(bf&&S.days<2)issues.push(pt?"O pequeno-almoço é para 2 manhãs ou mais (não precisam de ser seguidas).":"Breakfast is for 2 mornings or more (they don't need to be in a row).");
    w.textContent=issues.join(" ");a.style.opacity=issues.length?.45:1;a.style.pointerEvents=issues.length?"none":"";
    const svcTxt={breakfast:pt?"pequeno-almoço":"breakfast",lunch:pt?"almoço":"lunch",dinner:pt?"jantar":"dinner"}[S.svc];
    const dTxt=new Date(S.date+"T12:00").toLocaleDateString(pt?"pt-PT":"en-GB",{weekday:"long",day:"numeric",month:"long"});
    const msg=pt?`Olá Constança! Estamos hospedados na Casa da Azóia e gostávamos de reservar ${svcTxt} para ${S.people} pessoas, ${bf?`${S.days} manhãs a começar a `:"a "}${dTxt}.${S.notes?"\n"+S.notes:""}`
               :`Hi Constança! We're staying at Casa da Azóia and would like to book ${svcTxt} for ${S.people} people, ${bf?`${S.days} mornings starting on `:"on "}${dTxt}.${S.notes?"\n"+S.notes:""}`;
    a.href=waUrl(CHEF.phone,msg);
  };
  el.querySelectorAll("[data-svc]").forEach(b=>b.onclick=()=>{S.svc=b.dataset.svc;renderChef(id);el.classList.add("open")});
  el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.people=Math.max(1,Math.min(30,S.people+ +b.dataset.p));b.parentNode.querySelector("output").textContent=S.people;upd()});
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.days=Math.max(1,Math.min(14,S.days+ +b.dataset.d));b.parentNode.querySelector("output").textContent=S.days;upd()});
  el.querySelector('[data-f="date"]').onchange=e=>{S.date=e.target.value||isoD(min);upd()};
  el.querySelector('[data-f="notes"]').oninput=e=>{S.notes=e.target.value;upd()};
  el.querySelector('[data-a="open"]').onclick=()=>el.classList.add("open");
  el.querySelector('[data-a="close"]').onclick=()=>el.classList.remove("open");
  upd();
}

/* ---------- nav ---------- */
function go(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="explore"){renderChips();renderGrid()}
  if(location.hash.slice(1)!==v){try{history.replaceState(null,"","#"+v)}catch(e){location.hash=v}}
  window.scrollTo({top:0,behavior:"smooth"});
}
function openCard(id){
  const p=PLACES.find(x=>x.id===id);if(p.cat==="house"){go("house");setTimeout(()=>{const c=document.querySelector("#houseGrid #c-"+id);if(c){c.classList.add("open");c.scrollIntoView({behavior:"smooth",block:"center"})}},120);return}near="any";filter=p.secret&&p.cat!=="beach"?"secret":p.cat;go("explore");
  setTimeout(()=>{const c=document.getElementById("c-"+id);if(c){c.classList.add("open");c.scrollIntoView({behavior:"smooth",block:"center"})}},120);
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.v));
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;store.set("lang",L);renderAll()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["today","explore","week","house","saved"].includes(h))go(h)});

function renderAll(){renderCopy();renderToday();renderChips();renderGrid();renderWeek();renderSaved();renderHouse();renderChef("chefToday");renderChef("chefHouse");renderFavCount()}
renderAll();
loadCond();
const h0=location.hash.slice(1);if(["explore","week","house","saved"].includes(h0))go(h0);
setInterval(renderToday,60000);

/* ---------- add to home screen ---------- */
(function(){
  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  const ua=navigator.userAgent;const ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  const android=/Android/.test(ua);
  let deferred=null;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e});
  const last=store.get("a2hsDismissed",0);
  if(standalone||!(ios||android)||Date.now()-last<3*864e5) return;
  let inFrame=false;try{inFrame=window.self!==window.top}catch(e){inFrame=true}
  if(inFrame) return;
  const shareIc='<svg class="sh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
  function show(){
    const pt=L==="pt", el=document.getElementById("a2hs");
    const title=pt?"Guarda o guia no ecrã principal":"Add the guide to your home screen";
    const txt=ios
      ?(pt?`Fica como uma app, sempre à mão durante a estadia, com os teus favoritos guardados. Toca em ${shareIc} <b style="display:inline;font-size:inherit">Partilhar</b> e depois em <b style="display:inline;font-size:inherit">Adicionar ao ecrã principal</b>.`
          :`It works like an app, always at hand during your stay, with your favourites saved. Tap ${shareIc} <b style="display:inline;font-size:inherit">Share</b>, then <b style="display:inline;font-size:inherit">Add to Home Screen</b>.`)
      :(deferred?(pt?"Fica como uma app, sempre à mão durante a estadia, com os teus favoritos guardados.":"It works like an app, always at hand during your stay, with your favourites saved.")
          :(pt?"Fica como uma app, sempre à mão durante a estadia. No menu ⋮ do browser, toca em <b style=\"display:inline;font-size:inherit\">Adicionar ao ecrã principal</b>.":"It works like an app, always at hand during your stay. In the browser's ⋮ menu, tap <b style=\"display:inline;font-size:inherit\">Add to Home screen</b>."));
    el.innerHTML=`<div class="row"><div class="ic"></div><div><b>${title}</b><p>${txt}</p></div></div><div class="acts"><button class="no">${pt?"Agora não":"Not now"}</button>${deferred?`<button class="ok">${pt?"Adicionar":"Add"}</button>`:`<button class="ok">${pt?"Percebi":"Got it"}</button>`}</div>`;
    const close=()=>{el.classList.remove("on");store.set("a2hsDismissed",Date.now())};
    el.querySelector(".no").onclick=close;
    el.querySelector(".ok").onclick=async()=>{if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null}close()};
    el.classList.add("on");
  }
  setTimeout(show,5000);
})();
</script>
